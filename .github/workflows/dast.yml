name: DAST API Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: OpenAPI document URL reachable by the ZAP container.
        required: true
        default: https://staging.example.local/openapi.json
      target_override:
        description: Optional API base URL to override servers from the OpenAPI document.
        required: false
        default: ""
      fail_on_warn:
        description: Fail when ZAP reports WARN findings.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zap-api-scan:
    name: ZAP API scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ZAP API scan
        run: |
          mkdir -p tests/reports
          fail_flag="-I"
          if [ "${{ inputs.fail_on_warn }}" = "true" ]; then
            fail_flag=""
          fi
          override_arg=()
          if [ -n "${{ inputs.target_override }}" ]; then
            override_arg=(-O "${{ inputs.target_override }}")
          fi
          docker run --rm \
            -v "$PWD/tests/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t "${{ inputs.target_url }}" \
              -f openapi \
              "${override_arg[@]}" \
              -J zap-report.json \
              -r zap-report.html \
              $fail_flag

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-reports
          path: |
            tests/reports/zap-report.json
            tests/reports/zap-report.html
          if-no-files-found: ignore
