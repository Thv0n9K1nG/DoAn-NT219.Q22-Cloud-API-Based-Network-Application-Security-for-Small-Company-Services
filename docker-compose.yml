name: nt219-cloud-api-security

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-keycloak,kong,userdb,resourcedb,admindb,paymentdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-init-multiple-dbs.sh:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme-redis}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - app-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-root-token-for-lab-only}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "127.0.0.1:${VAULT_HOST_PORT:-8200}:8200"
    volumes:
      - vault-data:/vault/file
    networks:
      - dmz-net
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme-keycloak-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"
    volumes:
      - ./idp/realm-export.json:/opt/keycloak/data/import/saas-platform-realm.json:ro
    networks:
      - dmz-net
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/userdb
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-saas-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-saas-api}
      JWT_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/realms/${KEYCLOAK_REALM:-saas-platform}
      VAULT_ADDR: http://vault:8200
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_MLDSA_MTLS_REQUIRED: "true"
      INTERNAL_MLDSA_PUBLIC_KEY_FILE: /certs/mldsa-upstream-client.pub
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-certfile", "/certs/service.crt", "--ssl-keyfile", "/certs/service.key", "--ssl-ca-certs", "/certs/ca.crt", "--ssl-cert-reqs", "2"]
    volumes:
      - ./services/user-service/certs:/certs:ro
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; ctx=ssl.create_default_context(cafile='/certs/ca.crt'); ctx.check_hostname=False; ctx.load_cert_chain('/certs/health-client.crt','/certs/health-client.key'); urllib.request.urlopen('https://127.0.0.1:8000/health/live', timeout=3, context=ctx)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  resource-service:
    build:
      context: .
      dockerfile: services/resource-service/Dockerfile
    environment:
      SERVICE_NAME: resource-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/resourcedb
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-saas-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-saas-api}
      JWT_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/realms/${KEYCLOAK_REALM:-saas-platform}
      VAULT_ADDR: http://vault:8200
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_MLDSA_MTLS_REQUIRED: "true"
      INTERNAL_MLDSA_PUBLIC_KEY_FILE: /certs/mldsa-upstream-client.pub
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-certfile", "/certs/service.crt", "--ssl-keyfile", "/certs/service.key", "--ssl-ca-certs", "/certs/ca.crt", "--ssl-cert-reqs", "2"]
    volumes:
      - ./services/resource-service/certs:/certs:ro
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; ctx=ssl.create_default_context(cafile='/certs/ca.crt'); ctx.check_hostname=False; ctx.load_cert_chain('/certs/health-client.crt','/certs/health-client.key'); urllib.request.urlopen('https://127.0.0.1:8000/health/live', timeout=3, context=ctx)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    environment:
      SERVICE_NAME: admin-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/admindb
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-saas-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-saas-api}
      JWT_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/realms/${KEYCLOAK_REALM:-saas-platform}
      VAULT_ADDR: http://vault:8200
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_MLDSA_MTLS_REQUIRED: "true"
      INTERNAL_MLDSA_PUBLIC_KEY_FILE: /certs/mldsa-upstream-client.pub
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-certfile", "/certs/service.crt", "--ssl-keyfile", "/certs/service.key", "--ssl-ca-certs", "/certs/ca.crt", "--ssl-cert-reqs", "2"]
    volumes:
      - ./services/admin-service/certs:/certs:ro
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; ctx=ssl.create_default_context(cafile='/certs/ca.crt'); ctx.check_hostname=False; ctx.load_cert_chain('/certs/health-client.crt','/certs/health-client.key'); urllib.request.urlopen('https://127.0.0.1:8000/health/live', timeout=3, context=ctx)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/paymentdb
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-saas-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-saas-api}
      JWT_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/realms/${KEYCLOAK_REALM:-saas-platform}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${PAYMENT_SVC_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${PAYMENT_SVC_VAULT_SECRET_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_MLDSA_MTLS_REQUIRED: "true"
      INTERNAL_MLDSA_PUBLIC_KEY_FILE: /certs/mldsa-upstream-client.pub
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-certfile", "/certs/service.crt", "--ssl-keyfile", "/certs/service.key", "--ssl-ca-certs", "/certs/ca.crt", "--ssl-cert-reqs", "2"]
    volumes:
      - ./services/payment-service/certs:/certs:ro
    networks:
      - app-net
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; ctx=ssl.create_default_context(cafile='/certs/ca.crt'); ctx.check_hostname=False; ctx.load_cert_chain('/certs/health-client.crt','/certs/health-client.key'); urllib.request.urlopen('https://127.0.0.1:8000/health/live', timeout=3, context=ctx)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.65.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --log-level=info
      - /policies/policies
      - /policies/data
    ports:
      - "127.0.0.1:${OPA_HOST_PORT:-8181}:8181"
    volumes:
      - ./opa:/policies:ro
    networks:
      - dmz-net
      - app-net
    healthcheck:
      test: ["CMD", "opa", "eval", "true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  kong:
    image: kong:3.6.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: bundled,opa-authz
      KONG_LUA_PACKAGE_PATH: /usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: "off"
      KONG_SSL_CERT: /etc/kong/certs/kong.crt
      KONG_SSL_CERT_KEY: /etc/kong/certs/kong.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /etc/kong/certs/internal-ca.crt
      KONG_LUA_SSL_VERIFY_DEPTH: 2
      KONG_NGINX_PROXY_PROXY_SSL_TRUSTED_CERTIFICATE: /etc/kong/certs/internal-ca.crt
      KONG_NGINX_PROXY_PROXY_SSL_VERIFY_DEPTH: 2
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-info}
    ports:
      - "${KONG_PROXY_HTTP_PORT:-8000}:8000"
      - "${KONG_PROXY_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./gateway/certs:/etc/kong/certs:ro
      - ./gateway/plugins/opa-authz:/usr/local/share/lua/5.1/kong/plugins/opa-authz:ro
    networks:
      - dmz-net
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      user-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    networks:
      - dmz-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/alerts:/etc/grafana/provisioning/alerting:ro
    networks:
      - dmz-net
      - data-net
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    profiles:
      - observability
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - data-net
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

networks:
  dmz-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  vault-data:
  loki-data:
  grafana-data:
